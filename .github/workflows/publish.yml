name: Release packages and publication

on:
  pull_request:
    branches: [v3]
  push:
    tags: ['[0-9]*.*.*']

permissions:
  contents: read

jobs:
  release-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Build release packages and integrity evidence
        run: |
          version=$(php -r 'require "Tina4/App.php"; echo \Tina4\App::$VERSION;')
          php scripts/check-version-consistency.php "$version"
          mkdir -p dist
          git archive --format=tar.gz --prefix="tina4php-$version/" --output="dist/tina4php-$version.tar.gz" HEAD
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            test "$version" = "$GITHUB_REF_NAME" || { echo "Tag/source version mismatch"; exit 1; }
          fi
          python3 scripts/test_release_evidence.py
          python3 scripts/release_evidence.py --output dist --name tina4php --version "$version" --license MIT --repository tina4stack/tina4-php
          (cd dist && sha256sum --check SHA256SUMS)
          python3 -c 'import json; s=json.load(open("dist/sbom.spdx.json")); assert s["spdxVersion"] == "SPDX-2.3"; assert s["packages"] and s["files"]'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package-php
          path: dist/*
          if-no-files-found: error

  publish:
    needs: release-package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package-php
          path: dist
      - name: Verify immutable build artifact checksums
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*
      - name: Attest package SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/sbom.spdx.json
      - name: Extract this version's changelog
        run: |
          python3 - <<'PYNOTES'
          import os
          from pathlib import Path
          text = Path('CHANGELOG.md').read_text()
          marker = '## ' + os.environ['GITHUB_REF_NAME'] + '\n'
          notes = text.split(marker, 1)[1].split('\n## ', 1)[0].strip()
          if not notes:
              raise SystemExit('Release changelog is empty')
          Path('/tmp/release-notes.md').write_text(notes + '\n')
          PYNOTES
      - name: Create GitHub Release with integrity evidence
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: /tmp/release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
      - name: Notify Packagist
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -n "${PACKAGIST_TOKEN}" ]; then
            curl --fail-with-body -s -XPOST "https://packagist.org/api/update-package?username=tina4stack&apiToken=${PACKAGIST_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"repository":{"url":"https://github.com/tina4stack/tina4-php"}}'
          else
            echo "PACKAGIST_TOKEN not set; Packagist can discover the release tag."
          fi
