name: Tests

on:
  push:
    branches: [v3]
  pull_request:
    branches: [v3]

jobs:
  test:
    runs-on: ubuntu-latest

    # Real-service test gate. Every backend the suite can touch runs for real in
    # CI so the integration tests execute instead of skipping (the gap that let
    # the migration / queue bugs ship). Service containers are health-checked, so
    # the job fails if one never comes up. Ports mirror the local docker harness
    # (/tmp/tina4_infra_up.sh) so the same TINA4_TEST_* values work locally and here.
    services:
      # GreenMail: real SMTP 3025 + IMAP 3143 for the Messenger round-trip
      # tests. auth.disabled is REQUIRED, not laziness: every suite uses a unique
      # random recipient per test so each mailbox is created on FIRST ACCESS,
      # which cannot work against a server demanding pre-registered users.
      greenmail:
        image: greenmail/standalone:2.1.3
        ports: ['3025:3025', '3143:3143']
        env:
          GREENMAIL_OPTS: '-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled'
      # Cache backend services — mirror the local docker harness ports so the
      # CacheBackendsTest network backends run for real in CI.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:8
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211
        options: >-
          --health-cmd "timeout 2 bash -c '</dev/tcp/127.0.0.1/11211'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' || mongo --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # PostgreSQL for the live ORM / migration / create-table / boolean-binding /
      # UUID-PK / two-database-routing integration tests. Port 55432 mirrors the
      # local harness so the same TINA4_TEST_PG_URL works everywhere.
      postgres:
        image: postgres:16
        ports:
          - 55432:5432
        env:
          POSTGRES_USER: tina4
          POSTGRES_PASSWORD: tina4
          POSTGRES_DB: tina4_php
        options: >-
          --health-cmd "pg_isready -U tina4 -d tina4_php"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      # RabbitMQ for the live AMQP 0-9-1 handshake / enqueue-dequeue-ack test.
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

      # MySQL 8 for the live MySQL integration tests (#262 — MySQLMSSQLLiveTest,
      # the DatabaseDriversTest live/factory tests, BatchInsertTest). The image
      # creates the tina4_test database and the tina4 user from these env vars,
      # so the test connects with tina4/tina4 on the default port 3306.
      mysql:
        image: mysql:8
        ports:
          - 3306:3306
        env:
          MYSQL_DATABASE: tina4_test
          MYSQL_USER: tina4
          MYSQL_PASSWORD: tina4
          MYSQL_ROOT_PASSWORD: tina4
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptina4"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

      # SQL Server 2022 for the live MSSQL integration tests (#262). The image
      # starts EMPTY (no user database), so a follow-up step creates tina4_test.
      # PHP reaches it via ext-pdo_dblib (FreeTDS) — ext-sqlsrv is not installed.
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: 'Y'
          SA_PASSWORD: 'TinaSQL123!Secure'
          MSSQL_SA_PASSWORD: 'TinaSQL123!Secure'
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'TinaSQL123!Secure' -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'TinaSQL123!Secure' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    env:
      # Enable the real-service integration tests (they skip when unset).
      TINA4_TEST_PG_URL: postgres://tina4:tina4@localhost:55432/tina4_php
      TINA4_TEST_PG_HOST: localhost
      TINA4_TEST_PG_PORT: '55432'
      TINA4_TEST_PG_USERNAME: tina4
      TINA4_TEST_PG_PASSWORD: tina4
      TINA4_TEST_PG_DB: tina4_php
      TINA4_TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672
      TINA4_MONGO_URI: mongodb://localhost:27017
      TINA4_TEST_MONGO_URI: mongodb://localhost:27017
      TINA4_KAFKA_BROKERS: localhost:9092
      TINA4_TEST_KAFKA_URL: localhost:9092
      # MQTT 3.1.1 brokers started by the "Start MQTT brokers" step below;
      # TINA4_TEST_MQTT_CA_FILE is injected there once the certs are generated.
      TINA4_TEST_MQTT_URL: mqtt://127.0.0.1:1883
      TINA4_TEST_MQTT_AUTH_URL: mqtt://127.0.0.1:1884
      TINA4_TEST_MQTT_TLS_URL: mqtts://127.0.0.1:8883
      TINA4_TEST_MQTT_EMQX_URL: mqtt://127.0.0.1:1885
      TINA4_TEST_MQTT_USERNAME: tina4
      TINA4_TEST_MQTT_PASSWORD: testpass
      # Live MySQL (#262) — matches the mysql:8 service container above.
      TINA4_TEST_MYSQL_HOST: localhost
      TINA4_TEST_MYSQL_PORT: '3306'
      TINA4_TEST_MYSQL_USERNAME: tina4
      TINA4_TEST_MYSQL_PASSWORD: tina4
      TINA4_TEST_MYSQL_DB: tina4_test
      TINA4_TEST_MYSQL_URL: mysql://tina4:tina4@localhost:3306/tina4_test
      # Live MSSQL (#262) — matches the mssql:2022 service container above.
      TINA4_TEST_MSSQL_HOST: localhost
      TINA4_TEST_MSSQL_PORT: '1433'
      TINA4_TEST_MSSQL_USERNAME: sa
      TINA4_TEST_MSSQL_PASSWORD: 'TinaSQL123!Secure'
      TINA4_TEST_MSSQL_DB: tina4_test
      TINA4_TEST_MSSQL_URL: mssql://sa:TinaSQL123%21Secure@localhost:1433/tina4_test
      # Turn a missing provisioned service into a hard failure (no green skips).
      # NB: native Firebird lives in its OWN job (see `firebird:` below), NOT here —
      # stacking a heavyweight Firebird container onto this already-8-service job
      # destabilised the shared runner. Firebird is excluded from the
      # REQUIRE_SERVICES keyword set, so its absence here stays a green skip.
      TINA4_REQUIRE_SERVICES: '1'

    steps:
      # The greenmail/standalone image is a bare JRE with no nc/curl, so a
      # container --health-cmd cannot run -- and a probe that cannot run looks
      # exactly like a broken service. Wait from the RUNNER instead and FAIL the
      # job if it never listens: the require-services gate now treats a
      # "greenmail not reachable" skip as fatal, so a silent no-show must be loud
      # here rather than surfacing as a confusing gate failure later.
      # shell: bash is mandatory -- /dev/tcp is a bash feature, absent in sh.
      - name: Wait for GreenMail (SMTP 3025 / IMAP 3143)
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/3025) 2>/dev/null \
               && (exec 4<>/dev/tcp/127.0.0.1/3143) 2>/dev/null; then
              echo "GreenMail ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "GreenMail did not become ready in 60s"; exit 1

      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # pdo_pgsql + pgsql (live PostgreSQL), mysqli + pdo_mysql (live MySQL),
          # pdo_dblib (live MSSQL via FreeTDS), mongodb (queue/session/doc-store),
          # sockets (RabbitMQ AMQP frames), sqlite3 + pdo_sqlite (default engine).
          # The shivammathur runner image PRE-BUNDLES sqlsrv/pdo_sqlsrv, so the
          # MSSQL adapter would pick the sqlsrv backend and fail on the absent
          # Microsoft ODBC driver. Disable them (:ext) so the adapter uses the
          # pdo_dblib (FreeTDS) backend the live MSSQL tests rely on.
          extensions: pdo_pgsql, pgsql, mysqli, pdo_mysql, pdo_dblib, mongodb, sockets, sqlite3, pdo_sqlite, imap, :sqlsrv, :pdo_sqlsrv

      # The postgres service only creates POSTGRES_DB (tina4_php). The two-database
      # routing test needs tina4_rb, and the UUID-PK test connects to tina4 — create
      # both so those provisioned-service tests run instead of erroring.
      - name: Create extra PostgreSQL databases
        run: |
          for db in tina4_rb tina4; do
            PGPASSWORD=tina4 psql -h localhost -p 55432 -U tina4 -d tina4_php \
              -tc "SELECT 1 FROM pg_database WHERE datname = '$db'" | grep -q 1 \
              || PGPASSWORD=tina4 psql -h localhost -p 55432 -U tina4 -d tina4_php \
                   -c "CREATE DATABASE $db"
          done

      # The mssql:2022 service starts EMPTY — create the tina4_test database the
      # live MSSQL tests expect. Run sqlcmd from a one-off mssql-tools container
      # on the host network (the service publishes 1433 to the runner host).
      # FAIL the job if the database never gets created so the gate has teeth.
      - name: Create MSSQL tina4_test database
        run: |
          for i in $(seq 1 30); do
            if docker run --rm --network host mcr.microsoft.com/mssql-tools \
                /opt/mssql-tools/bin/sqlcmd -S localhost,1433 -U sa -P 'TinaSQL123!Secure' \
                -Q "IF DB_ID('tina4_test') IS NULL CREATE DATABASE tina4_test" 2>/dev/null; then
              echo "tina4_test database ready after ${i} attempt(s)"; exit 0
            fi
            echo "Waiting for SQL Server to accept connections (${i}/30) ..."
            sleep 2
          done
          echo "Could not create tina4_test on SQL Server in time"; exit 1

      # Password-protected Redis (requirepass s3cret, port 6381) for the auth
      # round-trip and wrong-password-falls-back-to-file tests. Started as a
      # plain container so --requirepass is deterministic from the first
      # connection (GitHub `services:` has no command field). Optional — the
      # auth tests skip cleanly if it is unreachable.
      - name: Start password-protected Redis (redis-auth)
        run: |
          docker run -d --name redis-auth -p 6381:6379 redis:7 redis-server --requirepass s3cret
          for i in $(seq 1 15); do
            if docker exec redis-auth redis-cli -a s3cret ping 2>/dev/null | grep -q PONG; then
              echo "redis-auth ready"; break
            fi
            sleep 1
          done

      # Kafka in KRaft mode (single node, no ZooKeeper). GitHub service containers
      # can't express the KRaft listener config cleanly, so run it as a plain
      # container and FAIL the job if the broker never serves metadata.
      - name: Start Kafka (KRaft)
        run: |
          docker run -d --name tina4-kafka -p 9092:9092 \
            -e KAFKA_NODE_ID=1 -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            apache/kafka:3.7.0
          echo "Waiting for Kafka to serve metadata on :9092 ..."
          for i in $(seq 1 60); do
            if docker exec tina4-kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              echo "Kafka ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Kafka did not become ready in 60s"; docker logs tina4-kafka | tail -40; exit 1

      # MQTT 3.1.1: Mosquitto (1883 anon / 1884 auth / 8883 TLS). The vendored
      # script generates certs + a password file, starts Mosquitto, and FAILS the
      # job if it does not come up - so the MQTT tests never skip green. EMQX (the
      # SUBACK-0x80 refusal path) is exercised only by the Ruby suite, so here it
      # is best-effort (MQTT_REQUIRE_EMQX=false: not started, never fatal).
      - name: Start MQTT brokers (Mosquitto 1883/1884/8883; EMQX best-effort)
        run: |
          MQTT_REQUIRE_EMQX=false bash tests/mqtt-infra.sh "$RUNNER_TEMP/tina4-mqtt-infra"
          echo "TINA4_TEST_MQTT_CA_FILE=$RUNNER_TEMP/tina4-mqtt-infra/certs/ca.crt" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # Metrics is measured by the NATIVE engine in the tina4 Rust CLI (ADR-0002)
      # and has no in-framework fallback, so the @group metrics classes need that
      # binary on PATH and simply cannot run here. The engine is tested where it
      # lives - tina4stack/tina4 src/metrics.rs, exercised by `cargo test` in its
      # own CI - so excluding them loses no coverage; installing a second
      # toolchain in four framework pipelines to re-test one Rust binary would
      # only duplicate it. They still run locally for anyone with the CLI.
      - name: Run tests
        run: vendor/bin/phpunit --exclude-group metrics

      - name: Report results
        if: always()
        run: echo "Test run completed with exit code $?"

  # Native Firebird runs in its OWN job (php #132). ext-interbase was removed from
  # PHP core in 7.4, so it is built from source (FirebirdSQL/php-firebird) against a
  # dedicated Firebird 5.0.2 — the native driver that the #132 reporter uses. Kept
  # separate from the `test` job on purpose: stacking a heavyweight Firebird
  # container onto that already-8-service runner destabilised the shared box, so
  # Firebird gets its own clean runner with nothing else competing for resources.
  # Only the Firebird-relevant test files run here; every other engine's tests stay
  # in `test`. pdo_firebird is NOT built (only the native ext), so the pdo legs skip
  # here — they run on macOS/local dev where pdo_firebird is present.
  firebird:
    runs-on: ubuntu-latest
    env:
      TINA4_TEST_FIREBIRD_URL: firebird://SYSDBA:masterkey@localhost:3050//var/lib/firebird/data/test.fdb
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite

      # Firebird 5.0.2 as a plain container (GitHub `services:` cannot wait for
      # Firebird's first-boot DB creation cleanly). FAIL the job if it never
      # accepts a query, so the coverage has teeth.
      - name: Start Firebird 5.0.2
        run: |
          docker run -d --name tina4-firebird -p 3050:3050 \
            -e FIREBIRD_ROOT_PASSWORD=masterkey \
            -e FIREBIRD_DATABASE=test.fdb \
            firebirdsql/firebird:5.0.2
          echo "Waiting for Firebird to accept connections on :3050 ..."
          for i in $(seq 1 30); do
            if docker exec tina4-firebird /opt/firebird/bin/isql -user SYSDBA -password masterkey \
                 /var/lib/firebird/data/test.fdb -q -o /dev/null <<<'SELECT 1 FROM RDB$DATABASE;' 2>/dev/null; then
              echo "Firebird ready after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "Firebird did not become ready in time"; docker logs tina4-firebird | tail -40; exit 1

      # Build native ext-interbase (ibase_*) from the maintained FirebirdSQL fork.
      # `php -m | grep interbase` FAILS the job if the build did not load, so a
      # broken build can never silently downgrade the native tests to a green skip.
      - name: Build native ext-interbase from source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfbclient2 firebird-dev
          git clone --depth 1 https://github.com/FirebirdSQL/php-firebird.git /tmp/php-firebird
          cd /tmp/php-firebird
          phpize
          ./configure --with-firebird
          make -j"$(nproc)"
          sudo make install
          scan_dir="$(php -i | awk -F' => ' '/Scan this dir for additional .ini files/ {print $2; exit}')"
          echo "extension=interbase.so" | sudo tee "${scan_dir}/99-interbase.ini"
          php -m | grep -i interbase || { echo "ext-interbase failed to load"; exit 1; }

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # Only the Firebird-relevant files (the native ORM/write/count/visibility
      # behavioural suite + the cross-engine files' Firebird cases). Non-Firebird
      # engines skip here (no server), and pdo legs skip (native-only build).
      #
      # Each file runs in its OWN phpunit process on purpose. ext-interbase hands
      # every connection with identical (path,user,pass,charset) args the SAME
      # physical link, so running many Firebird files in one process shares one
      # link across them; on native x86 Firebird 5.0.2 that shared link could
      # block indefinitely at teardown. A fresh process per file gives each file
      # its own link, so no file can wedge another. A per-file `timeout` FAILS the
      # job (naming the file) rather than hanging the runner for hours.
      - name: Run Firebird tests (native ext-interbase)
        run: |
          # Native ext-interbase tests PLUS the pdo_firebird tests. pdo_firebird is
          # present here (the setup-php PHP 8.2 image bundles it), so both drivers
          # are available and the native-vs-pdo parity + PDO-adapter tests run for
          # real. (If a future runner drops pdo_firebird those tests skip cleanly.)
          files="tests/FirebirdCharsetTest.php tests/FirebirdNullParamBindingTest.php \
            tests/FirebirdOrmCountTest.php tests/FirebirdOrmWriteTest.php \
            tests/FirebirdReconnectTest.php tests/FirebirdUrlTest.php \
            tests/FirebirdWriteVisibilityTest.php tests/MigrationV3Test.php \
            tests/DatabaseDriversTest.php tests/BooleanParamBindingTest.php \
            tests/SchemaQualifiedTest.php tests/PdoFirebirdAdapterTest.php \
            tests/PdoFallbackFactoryTest.php tests/PdoFallbackParityTest.php"
          failed=""
          for f in $files; do
            echo "::group::$f"
            if timeout 120 vendor/bin/phpunit --colors=never "$f"; then
              echo "$f OK"
            else
              rc=$?
              [ "$rc" -eq 124 ] && echo "!!! $f TIMED OUT (hang)" || echo "!!! $f failed rc=$rc"
              failed="$failed $f"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "Firebird test files failed/hung:$failed"; exit 1; fi
          echo "All Firebird test files passed (native ext-interbase)."

  # The redis/valkey CACHE DRIVER path runs in its OWN job, because it is the one
  # transport nothing else in this pipeline exercises.
  #
  # RedisBackend has TWO transports: ext-redis when the extension is loaded, and a
  # raw RESP socket otherwise. NOTHING installed ext-redis - not this workflow
  # (see the `extensions:` list in `test`), not composer.json (no predis), not the
  # lab, not a developer laptop - so every cache test the project has ever run took
  # the RAW path and the driver branch was executed by nothing at all. That branch
  # is not dead in the field: ext-redis is common on production PHP, so real users
  # take it every day. The gap was our test coverage, so the coverage is what gets
  # fixed here. The branch is NOT deleted (ADR-0004) - deleting it would break
  # working installations.
  #
  # This leg is the mirror image of the Python master's zero-dependency leg:
  # Python REMOVES its redis driver to gate the raw path, PHP ADDS its driver to
  # gate the driver path. The `test` job above already covers the raw path by
  # default (no extension present), so the two legs together cover both.
  cache-driver:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:8
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211
        options: >-
          --health-cmd "timeout 2 bash -c '</dev/tcp/127.0.0.1/11211'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' || mongo --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16
        ports:
          - 55432:5432
        env:
          POSTGRES_USER: tina4
          POSTGRES_PASSWORD: tina4
          POSTGRES_DB: tina4_php
        options: >-
          --health-cmd "pg_isready -U tina4 -d tina4_php"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # A skip because a provisioned service is missing becomes a hard FAILURE,
      # so this leg cannot go quietly green by not running.
      TINA4_REQUIRE_SERVICES: 1
      TINA4_TEST_PG_URL: postgres://tina4:tina4@localhost:55432/tina4_php

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # `redis` is the WHOLE POINT of this job (PECL phpredis). The rest are
          # what the cache suites touch: pdo_pgsql/pgsql for the database-identity
          # case, mongodb for the mongo backend, sqlite3/pdo_sqlite for the
          # database backend and the SQLite fixtures.
          extensions: redis, pdo_pgsql, pgsql, mongodb, sqlite3, pdo_sqlite

      # WITHOUT THIS ASSERTION THE JOB PROVES NOTHING. If the PECL build fails,
      # setup-php can continue and every test would silently fall back to the raw
      # RESP transport - the exact path the `test` job already covers - and this
      # leg would report a meaningless green. Fail loudly instead.
      - name: Assert ext-redis is actually loaded
        run: |
          php -m | grep -qx redis || { echo "ext-redis is NOT in php -m"; php -m; exit 1; }
          php -r 'exit(class_exists("Redis") ? 0 : 1);' \
            || { echo "ext-redis loaded but class Redis is missing"; exit 1; }
          php -r 'printf("phpredis %s loaded%s", phpversion("redis"), PHP_EOL);'

      # CacheBackendsTest covers the wrong-credentials fallback against a REAL
      # password-protected Redis on 6381.
      - name: Start password-protected Redis (redis-auth)
        run: |
          docker run -d --name redis-auth -p 6381:6379 redis:7 redis-server --requirepass s3cret
          for i in $(seq 1 15); do
            if docker exec redis-auth redis-cli -a s3cret ping 2>/dev/null | grep -q PONG; then
              echo "redis-auth ready"; break
            fi
            sleep 1
          done

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run cache suites on the ext-redis DRIVER transport
        run: |
          vendor/bin/phpunit --colors=never \
            tests/CacheTest.php \
            tests/CacheBackendsTest.php \
            tests/ResponseCacheTest.php \
            tests/QueryCacheTest.php \
            tests/DbQueryCacheTest.php \
            tests/ResponseCacheRfc9111Test.php \
            tests/CacheClearInvalidatesTest.php \
            tests/CacheKeyDatabaseIdentityTest.php \
            tests/CacheSweepCountsTest.php \
            tests/CacheNullRoundTripTest.php \
            tests/CacheClearPersistentLayerTest.php \
            tests/CacheProviderSelectionTest.php \
            tests/CacheMemcachedExptimeTest.php
