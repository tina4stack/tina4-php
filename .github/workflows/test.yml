name: Tests

on:
  push:
    branches: [v3]
  pull_request:
    branches: [v3]

jobs:
  test:
    runs-on: ubuntu-latest

    # Real-service test gate. Every backend the suite can touch runs for real in
    # CI so the integration tests execute instead of skipping (the gap that let
    # the migration / queue bugs ship). Service containers are health-checked, so
    # the job fails if one never comes up. Ports mirror the local docker harness
    # (/tmp/tina4_infra_up.sh) so the same TINA4_TEST_* values work locally and here.
    services:
      # Cache backend services — mirror the local docker harness ports so the
      # CacheBackendsTest network backends run for real in CI.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:8
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211
        options: >-
          --health-cmd "timeout 2 bash -c '</dev/tcp/127.0.0.1/11211'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' || mongo --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # PostgreSQL for the live ORM / migration / create-table / boolean-binding /
      # UUID-PK / two-database-routing integration tests. Port 55432 mirrors the
      # local harness so the same TINA4_TEST_POSTGRES_URL works everywhere.
      postgres:
        image: postgres:16
        ports:
          - 55432:5432
        env:
          POSTGRES_USER: tina4
          POSTGRES_PASSWORD: tina4
          POSTGRES_DB: tina4_php
        options: >-
          --health-cmd "pg_isready -U tina4 -d tina4_php"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      # RabbitMQ for the live AMQP 0-9-1 handshake / enqueue-dequeue-ack test.
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

      # MySQL 8 for the live MySQL integration tests (#262 — MySQLMSSQLLiveTest,
      # the DatabaseDriversTest live/factory tests, BatchInsertTest). The image
      # creates the tina4_test database and the tina4 user from these env vars,
      # so the test connects with tina4/tina4 on the default port 3306.
      mysql:
        image: mysql:8
        ports:
          - 3306:3306
        env:
          MYSQL_DATABASE: tina4_test
          MYSQL_USER: tina4
          MYSQL_PASSWORD: tina4
          MYSQL_ROOT_PASSWORD: tina4
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptina4"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

      # SQL Server 2022 for the live MSSQL integration tests (#262). The image
      # starts EMPTY (no user database), so a follow-up step creates tina4_test.
      # PHP reaches it via ext-pdo_dblib (FreeTDS) — ext-sqlsrv is not installed.
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: 'Y'
          SA_PASSWORD: 'TinaSQL123!Secure'
          MSSQL_SA_PASSWORD: 'TinaSQL123!Secure'
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'TinaSQL123!Secure' -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'TinaSQL123!Secure' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    env:
      # Enable the real-service integration tests (they skip when unset).
      TINA4_TEST_POSTGRES_URL: postgres://tina4:tina4@localhost:55432/tina4_php
      TINA4_TEST_PG_HOST: localhost
      TINA4_TEST_PG_PORT: '55432'
      TINA4_TEST_PG_USER: tina4
      TINA4_TEST_PG_PASS: tina4
      TINA4_TEST_PG_DB: tina4_php
      TINA4_TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672
      TINA4_MONGO_URI: mongodb://localhost:27017
      TINA4_TEST_MONGO_URL: mongodb://localhost:27017
      TINA4_KAFKA_BROKERS: localhost:9092
      TINA4_TEST_KAFKA_URL: localhost:9092
      # Live MySQL (#262) — matches the mysql:8 service container above.
      TINA4_TEST_MYSQL_HOST: localhost
      TINA4_TEST_MYSQL_PORT: '3306'
      TINA4_TEST_MYSQL_USER: tina4
      TINA4_TEST_MYSQL_PASS: tina4
      TINA4_TEST_MYSQL_DB: tina4_test
      TINA4_TEST_MYSQL_URL: mysql://tina4:tina4@localhost:3306/tina4_test
      # Live MSSQL (#262) — matches the mssql:2022 service container above.
      TINA4_TEST_MSSQL_HOST: localhost
      TINA4_TEST_MSSQL_PORT: '1433'
      TINA4_TEST_MSSQL_USER: sa
      TINA4_TEST_MSSQL_PASS: 'TinaSQL123!Secure'
      TINA4_TEST_MSSQL_DB: tina4_test
      TINA4_TEST_MSSQL_URL: mssql://sa:TinaSQL123%21Secure@localhost:1433/tina4_test
      # Turn a missing provisioned service into a hard failure (no green skips).
      TINA4_REQUIRE_SERVICES: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # pdo_pgsql + pgsql (live PostgreSQL), mysqli + pdo_mysql (live MySQL),
          # pdo_dblib (live MSSQL via FreeTDS — ext-sqlsrv is not used here),
          # mongodb (queue/session/doc-store), sockets (RabbitMQ AMQP frames),
          # sqlite3 + pdo_sqlite (default engine).
          extensions: pdo_pgsql, pgsql, mysqli, pdo_mysql, pdo_dblib, mongodb, sockets, sqlite3, pdo_sqlite

      # The postgres service only creates POSTGRES_DB (tina4_php). The two-database
      # routing test needs tina4_rb, and the UUID-PK test connects to tina4 — create
      # both so those provisioned-service tests run instead of erroring.
      - name: Create extra PostgreSQL databases
        run: |
          for db in tina4_rb tina4; do
            PGPASSWORD=tina4 psql -h localhost -p 55432 -U tina4 -d tina4_php \
              -tc "SELECT 1 FROM pg_database WHERE datname = '$db'" | grep -q 1 \
              || PGPASSWORD=tina4 psql -h localhost -p 55432 -U tina4 -d tina4_php \
                   -c "CREATE DATABASE $db"
          done

      # The mssql:2022 service starts EMPTY — create the tina4_test database the
      # live MSSQL tests expect. Run sqlcmd from a one-off mssql-tools container
      # on the host network (the service publishes 1433 to the runner host).
      # FAIL the job if the database never gets created so the gate has teeth.
      - name: Create MSSQL tina4_test database
        run: |
          for i in $(seq 1 30); do
            if docker run --rm --network host mcr.microsoft.com/mssql-tools \
                /opt/mssql-tools/bin/sqlcmd -S localhost,1433 -U sa -P 'TinaSQL123!Secure' \
                -Q "IF DB_ID('tina4_test') IS NULL CREATE DATABASE tina4_test" 2>/dev/null; then
              echo "tina4_test database ready after ${i} attempt(s)"; exit 0
            fi
            echo "Waiting for SQL Server to accept connections (${i}/30) ..."
            sleep 2
          done
          echo "Could not create tina4_test on SQL Server in time"; exit 1

      # Password-protected Redis (requirepass s3cret, port 6381) for the auth
      # round-trip and wrong-password-falls-back-to-file tests. Started as a
      # plain container so --requirepass is deterministic from the first
      # connection (GitHub `services:` has no command field). Optional — the
      # auth tests skip cleanly if it is unreachable.
      - name: Start password-protected Redis (redis-auth)
        run: |
          docker run -d --name redis-auth -p 6381:6379 redis:7 redis-server --requirepass s3cret
          for i in $(seq 1 15); do
            if docker exec redis-auth redis-cli -a s3cret ping 2>/dev/null | grep -q PONG; then
              echo "redis-auth ready"; break
            fi
            sleep 1
          done

      # Kafka in KRaft mode (single node, no ZooKeeper). GitHub service containers
      # can't express the KRaft listener config cleanly, so run it as a plain
      # container and FAIL the job if the broker never serves metadata.
      - name: Start Kafka (KRaft)
        run: |
          docker run -d --name tina4-kafka -p 9092:9092 \
            -e KAFKA_NODE_ID=1 -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            apache/kafka:3.7.0
          echo "Waiting for Kafka to serve metadata on :9092 ..."
          for i in $(seq 1 60); do
            if docker exec tina4-kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              echo "Kafka ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Kafka did not become ready in 60s"; docker logs tina4-kafka | tail -40; exit 1

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Report results
        if: always()
        run: echo "Test run completed with exit code $?"
