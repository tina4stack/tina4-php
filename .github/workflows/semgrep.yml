name: Semgrep (PHP code scanning)

# CodeQL has no PHP support, so PHP source is scanned with Semgrep and the
# results land in GitHub code scanning next to CodeQL's (JavaScript/Actions,
# via CodeQL default setup). CI-only tool: nothing is added to composer.json.
# Plan item G10, ADR-0073.

on:
  push:
    branches: [v3]
  pull_request:
    branches: [v3]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to code scanning
    container:
      # Pinned by digest (ADR-0073: release-path tooling is pinned).
      image: semgrep/semgrep@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan PHP source
        run: >
          semgrep scan
          --config p/php
          --config p/security-audit
          --metrics=off
          --sarif --output semgrep.sarif
          Tina4 bin

      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep-php
